<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TezGo — xarita</title>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://photon.komoot.io" crossorigin>
<link rel="preconnect" href="https://nominatim.openstreetmap.org" crossorigin>
<link rel="preload" href="https://tiles.openfreemap.org/styles/liberty" as="fetch" crossorigin>
<link rel="preload" href="https://tiles.openfreemap.org/planet" as="fetch" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script defer src="https://telegram.org/js/telegram-web-app.js"></script>
<script defer src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }
  .top { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10; }
  .search { display: flex; gap: 8px; }
  .search input { flex: 1; min-width: 0; padding: 12px 14px; border: 0; border-radius: 12px;
    background: var(--bg); color: var(--text); font-size: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .search button { padding: 0 16px; border: 0; border-radius: 12px; background: var(--accent);
    color: var(--accent-text); font-size: 15px; font-weight: 600; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .results { margin-top: 8px; background: var(--bg); border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.15); display: none; max-height: 45vh; overflow-y: auto; }
  .results .row { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border-bottom: 1px solid var(--card); cursor: pointer; }
  .results .row:last-child { border-bottom: 0; }
  .results .row:active { background: var(--card); }
  .results .icon { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--card);
    display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .results .text { min-width: 0; }
  .results .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .results .sub { color: var(--hint); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .results .head { padding: 8px 14px 4px; color: var(--hint); font-size: 12px; text-transform: uppercase; }
  .results .empty { padding: 12px 14px; color: var(--hint); }
  .results .loading::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 8px;
    vertical-align: -1px; border: 2px solid var(--hint); border-right-color: transparent; border-radius: 50%;
    animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pin { position: absolute; left: 50%; top: 50%; z-index: 5; pointer-events: none;
    transform: translate(-50%, -100%); font-size: 40px; line-height: 1; transition: transform .15s; }
  .pin.lifted { transform: translate(-50%, -125%); }
  .shadow { position: absolute; left: 50%; top: 50%; z-index: 4; width: 10px; height: 4px;
    margin: -2px 0 0 -5px; border-radius: 50%; background: rgba(0,0,0,.35); pointer-events: none; }
  .bottom { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 10; }
  .card { background: var(--bg); border-radius: 14px; padding: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.18); }
  .title { color: var(--hint); font-size: 13px; margin-bottom: 4px; }
  .address { font-weight: 600; min-height: 20px; }
  .controls { position: absolute; right: 12px; bottom: 110px; z-index: 10; transition: bottom .15s;
    display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .zoom { display: flex; flex-direction: column; border-radius: 26px; overflow: hidden;
    background: var(--bg); box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .zoom button { width: 52px; height: 52px; padding: 0; border: 0; background: transparent; color: var(--text);
    font-size: 30px; font-weight: 300; line-height: 1; cursor: pointer; }
  .zoom button + button { border-top: 1px solid var(--card); }
  .zoom button:active, .mine:active, .view:active { opacity: .6; }
  .view { width: 52px; height: 52px; padding: 0; border: 0; border-radius: 50%; background: var(--bg);
    color: var(--text); font-size: 16px; font-weight: 700; box-shadow: 0 2px 10px rgba(0,0,0,.25); cursor: pointer; }
  .view.on { color: var(--accent); }
  .mine { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; padding: 0;
    border: 0; border-radius: 50%; background: var(--bg); color: var(--accent);
    box-shadow: 0 2px 10px rgba(0,0,0,.25); cursor: pointer; }
  .mine svg { width: 26px; height: 26px; }
  .mine .arrow { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .mine.active .arrow { fill: currentColor; }
  .mine.busy svg { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .me { width: 18px; height: 18px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff;
    box-shadow: 0 0 0 6px rgba(26,115,232,.25), 0 1px 4px rgba(0,0,0,.3); }
  .start { width: 18px; height: 18px; border-radius: 50%; background: #2e7d32; border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .confirm { display: none; width: 100%; margin-top: 10px; padding: 14px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-text); font-size: 16px; font-weight: 600; }
  .maplibregl-ctrl-attrib { font-size: 10px; }
  .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { display: none; }
  .attrib { position: absolute; left: 12px; z-index: 6; font-size: 10px; color: var(--hint);
    background: rgba(255,255,255,.7); padding: 1px 6px; border-radius: 6px; }
  .attrib a { color: inherit; }
</style>
</head>
<body>
<div id="map"></div>
<div class="shadow"></div>
<div class="pin" id="pin">📍</div>

<div class="top">
  <form class="search" id="form">
    <input id="query" type="search" autocomplete="off" enterkeyhint="search">
    <button type="submit" id="find"></button>
  </form>
  <div class="results" id="results"></div>
</div>

<div class="attrib" id="attrib"><a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a></div>
<div class="controls" id="controls">
  <button class="view" id="view" type="button">3D</button>
  <div class="zoom">
    <button type="button" id="zoom-in">+</button>
    <button type="button" id="zoom-out">−</button>
  </div>
  <button class="mine" id="mine" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="arrow" d="M20.5 3.5 3.5 10.6l7 2.9 2.9 7 7.1-17z"/></svg>
  </button>
</div>

<div class="bottom" id="bottom">
  <div class="card">
    <div class="title" id="title"></div>
    <div class="address" id="address"></div>
    <button class="confirm" id="confirm" type="button"></button>
  </div>
</div>

<script type="module">
const TEXT = {
  uz: {
    from: "Qayerdan?", to: "Qayerga?", placeholder: "Manzil: Amir Temur 108",
    find: "Qidirish", none: "Hech narsa topilmadi", confirm: "Tasdiqlash",
    locating: "Manzil aniqlanmoqda…", unknown: "Xaritadagi nuqta",
    geo_denied: "Joylashuvni aniqlab bo'lmadi", outside: "Sahifani Telegram ichida oching",
    my_location: "Mening joylashuvim", zoom_in_btn: "Yaqinlashtirish", zoom_out_btn: "Uzoqlashtirish",
    finding_me: "Joylashuvingiz aniqlanmoqda…", pick_hint: "Xaritada nuqtani tanlang yoki manzilni qidiring",
    zoom_in: "Aniq nuqta uchun xaritani yaqinlashtiring", recent: "Oldingi manzillar", searching: "Qidirilmoqda…", view_3d: "3D ko'rinish", view_2d: "Tepadan ko'rinish"
  },
  ru: {
    from: "Откуда?", to: "Куда?", placeholder: "Адрес: Амира Темура 108",
    find: "Найти", none: "Ничего не найдено", confirm: "Подтвердить",
    locating: "Определяем адрес…", unknown: "Точка на карте",
    geo_denied: "Не удалось определить геопозицию", outside: "Откройте страницу внутри Telegram",
    my_location: "Моё местоположение", zoom_in_btn: "Приблизить", zoom_out_btn: "Отдалить",
    finding_me: "Определяем ваше местоположение…", pick_hint: "Выберите точку на карте или найдите адрес",
    zoom_in: "Приблизьте карту, чтобы выбрать точное место", recent: "Недавние адреса", searching: "Ищем…", view_3d: "3D-вид", view_2d: "Вид сверху"
  }
};

const STYLE = "https://tiles.openfreemap.org/styles/liberty";
const NOMINATIM = "https://nominatim.openstreetmap.org";
const TASHKENT = [69.2797, 41.3111];
const CITY_ZOOM = 11;
const STREET_ZOOM = 16.5;
const MIN_POINT_ZOOM = 14.5;
const PHOTON = "https://photon.komoot.io";
const BBOX = "69.0,41.09,69.56,41.53";
let locating = false;

const webApp = window.Telegram && window.Telegram.WebApp;
const tg = webApp && webApp.platform && webApp.platform !== "unknown" ? webApp : null;
const params = new URLSearchParams(location.search);
const lang = params.get("lang") === "ru" ? "ru" : "uz";
const mode = params.get("mode") === "to" ? "to" : "from";
const T = TEXT[lang];
const $ = (id) => document.getElementById(id);

document.documentElement.lang = lang;
$("title").textContent = T[mode];
$("query").placeholder = T.placeholder;
$("find").textContent = T.find;
$("mine").setAttribute("aria-label", T.my_location);
$("mine").title = T.my_location;
$("zoom-in").setAttribute("aria-label", T.zoom_in_btn);
$("zoom-out").setAttribute("aria-label", T.zoom_out_btn);
$("confirm").textContent = T.confirm;

function number(name) {
  const value = parseFloat(params.get(name));
  return Number.isFinite(value) ? value : null;
}

const startLat = number("lat"), startLon = number("lon");
const hasStart = startLat !== null && startLon !== null;
const LAST_KEY = "taxi_map_last";
const LAST_MAX_AGE = 7 * 24 * 3600 * 1000;

function lastPlace() {
  try {
    const [lon, lat, ts] = JSON.parse(localStorage.getItem(LAST_KEY) || "null") || [];
    return Number.isFinite(lon) && Number.isFinite(lat) && Date.now() - ts < LAST_MAX_AGE ? [lon, lat] : null;
  } catch (e) {
    return null;
  }
}

function rememberPlace(point) {
  try { localStorage.setItem(LAST_KEY, JSON.stringify([point[0], point[1], Date.now()])); } catch (e) {}
}

const last = hasStart ? null : lastPlace();
const map = new maplibregl.Map({
  container: "map",
  style: STYLE,
  center: hasStart ? [startLon, startLat] : last || TASHKENT,
  zoom: hasStart || last ? STREET_ZOOM : CITY_ZOOM,
  maxZoom: 19,
  fadeDuration: 0,
  pitchWithRotate: true,
  dragRotate: false,
  touchPitch: false,
  attributionControl: false
});
map.touchZoomRotate.disableRotation();

const LABEL = lang === "ru"
  ? ["coalesce", ["get", "name:ru"], ["get", "name:nonlatin"], ["get", "name:latin"], ["get", "name"]]
  : ["coalesce", ["get", "name:uz"], ["get", "name:latin"], ["get", "name"]];

map.on("styleimagemissing", (e) => {
  if (!map.hasImage(e.id)) map.addImage(e.id, { width: 1, height: 1, data: new Uint8Array(4) });
});

function placeControls() {
  const h = $("bottom").offsetHeight;
  $("controls").style.bottom = `${h + 24}px`;
  $("attrib").style.bottom = `${h + 16}px`;
}
if (window.ResizeObserver) new ResizeObserver(placeControls).observe($("bottom"));
placeControls();

map.on("style.load", () => {
  for (const layer of map.getStyle().layers) {
    const field = layer.layout && layer.layout["text-field"];
    if (field && JSON.stringify(field).includes("name")) map.setLayoutProperty(layer.id, "text-field", LABEL);
  }
  applyBuildings();
});

function applyBuildings() {
  if (!map.getLayer("building") || !map.getLayer("building-3d")) return;
  map.setLayerZoomRange("building", 13, threeD ? 14 : 24);
  map.setLayoutProperty("building-3d", "visibility", threeD ? "visible" : "none");
}

const aLat = number("alat"), aLon = number("alon");
if (mode === "to" && aLat !== null && aLon !== null) {
  const el = document.createElement("div");
  el.className = "start";
  new maplibregl.Marker({ element: el }).setLngLat([aLon, aLat]).addTo(map);
}

$("zoom-in").addEventListener("click", () => map.zoomIn({ duration: 250 }));
$("zoom-out").addEventListener("click", () => map.zoomOut({ duration: 250 }));

const VIEW_KEY = "taxi_map_3d";
let threeD = false;

function setView(on, animate) {
  threeD = on;
  applyBuildings();
  const handlers = [map.dragRotate, map.touchPitch];
  for (const h of handlers) on ? h.enable() : h.disable();
  on ? map.touchZoomRotate.enableRotation() : map.touchZoomRotate.disableRotation();
  const camera = on ? { pitch: 60 } : { pitch: 0, bearing: 0 };
  animate ? map.easeTo({ ...camera, duration: 500 }) : map.jumpTo(camera);
  $("view").textContent = on ? "2D" : "3D";
  $("view").classList.toggle("on", on);
  $("view").setAttribute("aria-label", on ? T.view_2d : T.view_3d);
  try { localStorage.setItem(VIEW_KEY, on ? "1" : "0"); } catch (e) {}
}

$("view").addEventListener("click", () => setView(!threeD, true));
try { setView(localStorage.getItem(VIEW_KEY) === "1", false); } catch (e) { setView(false, false); }

function formatAddress(a) {
  const area = a.suburb || a.city_district || a.neighbourhood || a.quarter || a.residential;
  let street = a.road || a.pedestrian || a.footway;
  if (street && a.house_number) street += " " + a.house_number;
  const place = a.amenity || a.shop || a.building;
  let parts = [area, street || place].filter(Boolean);
  if (!parts.length) parts = [a.city || a.town || a.village].filter(Boolean);
  return [...new Set(parts)].join(", ");
}

let lastRequest = 0;
async function nominatim(path, query) {
  const wait = 1100 - (Date.now() - lastRequest);
  if (wait > 0) await new Promise((r) => setTimeout(r, wait));
  lastRequest = Date.now();
  const url = `${NOMINATIM}/${path}?${new URLSearchParams({ format: "jsonv2", "accept-language": lang, ...query })}`;
  const response = await fetch(url);
  if (!response.ok) throw new Error(response.status);
  return response.json();
}

let reverseToken = 0;
async function updateAddress() {
  const token = ++reverseToken;
  if (map.getZoom() < MIN_POINT_ZOOM) {
    $("address").textContent = locating ? T.finding_me : T.zoom_in;
    return;
  }
  const c = map.getCenter();
  $("address").textContent = T.locating;
  try {
    const data = await nominatim("reverse", { lat: c.lat, lon: c.lng, zoom: 18, addressdetails: 1 });
    if (token === reverseToken) $("address").textContent = formatAddress(data.address || {}) || T.unknown;
  } catch (e) {
    if (token === reverseToken) $("address").textContent = T.unknown;
  }
}

let moveTimer = null;
map.on("dragstart", leaveMe);
map.on("zoomstart", (e) => { if (e.originalEvent) leaveMe(); });
map.on("movestart", () => {
  $("pin").classList.add("lifted");
  hideResults();
});
map.on("moveend", () => {
  $("pin").classList.remove("lifted");
  clearTimeout(moveTimer);
  moveTimer = setTimeout(updateAddress, 500);
});

function leaveMe() {
  follow = false;
  if (atMe) {
    atMe = false;
    $("mine").classList.remove("active");
  }
}

const RECENT = (() => {
  try {
    const raw = new URLSearchParams(location.hash.slice(1)).get("r");
    const items = raw ? JSON.parse(raw) : [];
    return Array.isArray(items) ? items.filter((i) => Array.isArray(i) && i.length === 3).slice(0, 6) : [];
  } catch (e) {
    return [];
  }
})();

const ICONS = [
  [["railway", "station"], "🚇"], [["railway", "subway_entrance"], "🚇"], [["railway", "stop"], "🚇"],
  [["railway", "halt"], "🚆"], [["highway", "bus_stop"], "🚌"], [["aeroway"], "✈️"],
  [["amenity", "restaurant"], "🍽"], [["amenity", "cafe"], "☕"], [["amenity", "fast_food"], "🍔"],
  [["amenity", "university"], "🎓"], [["amenity", "college"], "🎓"], [["amenity", "school"], "🏫"],
  [["amenity", "kindergarten"], "🧸"], [["amenity", "hospital"], "🏥"], [["amenity", "clinic"], "🏥"],
  [["amenity", "pharmacy"], "💊"], [["amenity", "bank"], "🏦"], [["amenity", "fuel"], "⛽"],
  [["amenity", "place_of_worship"], "🕌"], [["shop", "mall"], "🏬"], [["shop"], "🛍"],
  [["tourism", "hotel"], "🏨"], [["tourism"], "📸"], [["leisure", "park"], "🌳"], [["leisure"], "🏟"],
  [["place"], "🏘"], [["highway"], "🛣"], [["building"], "🏢"]
];
const SKIP_AREAS = new Set(["Tashkent", "Toshkent", "Ташкент"]);

function iconOf(p) {
  for (const [[key, value], icon] of ICONS) {
    if (p.osm_key === key && (!value || p.osm_value === value)) return icon;
  }
  return "📍";
}

function describe(p) {
  const street = [p.street, p.housenumber].filter(Boolean).join(" ");
  const name = (p.name || "").trim() || street;
  const area = p.district || p.locality || p.city;
  const sub = [];
  if (street && street !== name) sub.push(street);
  if (area && !SKIP_AREAS.has(area) && area !== name) sub.push(area);
  return { name, sub: sub.join(", ") };
}

const SAME_PLACE_M = 400;

function meters(a, b) {
  const k = Math.PI / 180;
  const x = (b.lon - a.lon) * k * Math.cos(((a.lat + b.lat) / 2) * k);
  const y = (b.lat - a.lat) * k;
  return Math.sqrt(x * x + y * y) * 6371000;
}

let searchController = null;
let searchToken = 0;
async function photon(q) {
  if (searchController) searchController.abort();
  searchController = new AbortController();
  const c = map.getCenter();
  const query = new URLSearchParams({ q, limit: 10, lang: "default", lat: c.lat.toFixed(4), lon: c.lng.toFixed(4), bbox: BBOX });
  const response = await fetch(`${PHOTON}/api/?${query}`, { signal: searchController.signal });
  if (!response.ok) throw new Error(response.status);
  const data = await response.json();
  const seen = new Set();
  const items = [];
  for (const f of data.features || []) {
    const p = f.properties || {};
    const { name, sub } = describe(p);
    const [lon, lat] = f.geometry.coordinates;
    const key = `${name}|${sub}`;
    const twin = items.some((i) => i.name.toLowerCase() === name.toLowerCase() && meters(i, { lat, lon }) < SAME_PLACE_M);
    if (!name || seen.has(key) || twin) continue;
    seen.add(key);
    items.push({ icon: iconOf(p), name, sub, lon, lat });
    if (items.length >= 6) break;
  }
  return items;
}

function row(item) {
  const el = document.createElement("div");
  el.className = "row";
  el.innerHTML = '<div class="icon"></div><div class="text"><div class="name"></div><div class="sub"></div></div>';
  el.querySelector(".icon").textContent = item.icon;
  el.querySelector(".name").textContent = item.name;
  el.querySelector(".sub").textContent = item.sub || "";
  el.addEventListener("click", () => {
    $("query").value = item.name;
    $("query").blur();
    hideResults();
    map.jumpTo({ center: [item.lon, item.lat], zoom: STREET_ZOOM });
  });
  return el;
}

function note(text, extra) {
  const el = document.createElement("div");
  el.className = "empty" + (extra ? " " + extra : "");
  el.textContent = text;
  return el;
}

function showList(items, head, loading) {
  const box = $("results");
  box.innerHTML = "";
  if (head) {
    const h = document.createElement("div");
    h.className = "head";
    h.textContent = head;
    box.appendChild(h);
  }
  for (const item of items) box.appendChild(row(item));
  if (loading) box.appendChild(note(T.searching, "loading"));
  else if (!items.length) box.appendChild(note(T.none));
  box.style.display = "block";
}

function hideResults() {
  $("results").style.display = "none";
}

function showRecent() {
  if (!RECENT.length) return hideResults();
  showList(RECENT.map(([name, lat, lon]) => ({ icon: "🕘", name, sub: "", lat, lon })), T.recent);
}

const cache = new Map();
const CACHE_SIZE = 60;

function words(text) {
  return text.toLowerCase().split(/[\s,.'ʻʼ‘’-]+/).filter(Boolean);
}

function instant(q) {
  const need = words(q);
  const pool = [...RECENT.map(([name, lat, lon]) => ({ icon: "🕘", name, sub: "", lat, lon }))];
  for (const items of cache.values()) pool.push(...items);
  const seen = new Set();
  const out = [];
  for (const item of pool) {
    const have = words(`${item.name} ${item.sub}`);
    const key = `${item.name}|${item.sub}`;
    if (seen.has(key) || !need.every((w) => have.some((h) => h.startsWith(w)))) continue;
    seen.add(key);
    out.push(item);
    if (out.length >= 6) break;
  }
  return out;
}

async function suggest(q) {
  const key = q.toLowerCase();
  if (cache.has(key)) {
    searchToken++;
    return showList(cache.get(key));
  }
  const token = ++searchToken;
  showList(instant(q), null, true);
  try {
    const items = await photon(q);
    cache.set(key, items);
    if (cache.size > CACHE_SIZE) cache.delete(cache.keys().next().value);
    if (token === searchToken && $("query").value.trim().toLowerCase() === key) showList(items);
  } catch (e) {
    if (e.name !== "AbortError" && token === searchToken) showList(instant(q));
  }
}

let typingTimer = null;
$("query").addEventListener("input", () => {
  clearTimeout(typingTimer);
  const q = $("query").value.trim();
  if (q.length < 2) {
    searchToken++;
    if (searchController) searchController.abort();
    return q ? hideResults() : showRecent();
  }
  const key = q.toLowerCase();
  if (cache.has(key)) return suggest(q);
  showList(instant(q), null, true);
  typingTimer = setTimeout(() => suggest(q), 200);
});

$("query").addEventListener("focus", () => {
  const q = $("query").value.trim();
  if (q.length >= 2) suggest(q);
  else showRecent();
});

$("form").addEventListener("submit", (event) => {
  event.preventDefault();
  clearTimeout(typingTimer);
  const q = $("query").value.trim();
  if (q.length < 2) return;
  $("query").blur();
  suggest(q);
});

function position(options, done) {
  navigator.geolocation.getCurrentPosition(
    (p) => done([p.coords.longitude, p.coords.latitude]),
    () => done(null),
    options
  );
}

function browserLocation(done) {
  if (!navigator.geolocation) return done(null, true);
  position({ enableHighAccuracy: false, timeout: 4000, maximumAge: 300000 }, (quick) => {
    if (quick) done(quick, false);
    position({ enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }, (precise) => done(precise, true));
  });
}

function currentLocation(done) {
  const manager = tg && tg.LocationManager;
  if (!manager || typeof manager.init !== "function") return browserLocation(done);
  manager.init(() => {
    if (!manager.isLocationAvailable) return browserLocation(done);
    manager.getLocation((data) => data ? done([data.longitude, data.latitude], true) : browserLocation(done));
  });
}

let meMarker = null;
let atMe = false;
let follow = false;

function showMe(point) {
  if (meMarker) {
    meMarker.setLngLat(point);
    return;
  }
  const el = document.createElement("div");
  el.className = "me";
  meMarker = new maplibregl.Marker({ element: el }).setLngLat(point).addTo(map);
}

function locateMe(silent) {
  locating = true;
  follow = true;
  let found = false;
  $("mine").classList.add("busy");
  if (map.getZoom() < MIN_POINT_ZOOM) $("address").textContent = T.finding_me;
  currentLocation((point, final) => {
    if (point) {
      found = true;
      showMe(point);
      rememberPlace(point);
      if (follow) {
        map.jumpTo({ center: point, zoom: Math.max(map.getZoom(), STREET_ZOOM) });
        atMe = true;
        $("mine").classList.add("active");
      }
    }
    if (!final) return;
    locating = false;
    $("mine").classList.remove("busy");
    if (found) return;
    if (map.getZoom() < MIN_POINT_ZOOM) $("address").textContent = T.pick_hint;
    if (!silent) tg ? tg.showAlert(T.geo_denied) : alert(T.geo_denied);
  });
}

$("mine").addEventListener("click", () => locateMe(false));

function confirmPoint() {
  if (map.getZoom() < MIN_POINT_ZOOM) {
    tg ? tg.showAlert(T.zoom_in) : alert(T.zoom_in);
    return;
  }
  const c = map.getCenter();
  const payload = JSON.stringify({ lat: +c.lat.toFixed(6), lon: +c.lng.toFixed(6) });
  if (tg) {
    tg.sendData(payload);
  } else {
    alert(T.outside);
  }
}

if (tg) {
  tg.ready();
  tg.expand();
  if (typeof tg.disableVerticalSwipes === "function") tg.disableVerticalSwipes();
  tg.MainButton.setText(T.confirm);
  tg.MainButton.onClick(confirmPoint);
  tg.MainButton.show();
} else {
  $("confirm").style.display = "block";
  $("confirm").addEventListener("click", confirmPoint);
}

if (hasStart) {
  updateAddress();
} else {
  locateMe(true);
}
</script>
</body>
